name: CI

on:
  push:
    # Development is where work lands; main does not exist in this repository,
    # so branch pushes were running no checks at all and portability breaks
    # only surfaced when a release was cut.
    branches: [main, Development]
  pull_request:

jobs:
  check:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite, pgsql, mysql]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: magna_test
          POSTGRES_USER: magna
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: magna_test
          MYSQL_USER: magna
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umagna -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, gd, pdo_sqlite, pdo_pgsql, pdo_mysql, redis
          coverage: none

      # composer's post-autoload-dump script boots Laravel to discover
      # packages, so the environment file has to exist before install runs.
      - name: Create the environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          php artisan key:generate
          php artisan package:discover --ansi

      # DB connection is exported to the PROCESS environment ($GITHUB_ENV), not
      # .env. phpunit.xml pins DB_CONNECTION=sqlite/:memory: with a non-forced
      # <env>, which only applies when the variable is absent from the process
      # environment (and Laravel's immutable Dotenv won't override a process
      # var either). Writing to .env is therefore ignored under `artisan test`;
      # exporting here is what actually switches the driver the tests run on.
      - name: Configure SQLite
        if: matrix.db == 'sqlite'
        run: touch database/database.sqlite

      - name: Configure PostgreSQL
        if: matrix.db == 'pgsql'
        run: |
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=magna_test"
            echo "DB_USERNAME=magna"
            echo "DB_PASSWORD=secret"
          } >> "$GITHUB_ENV"

      - name: Configure MySQL
        if: matrix.db == 'mysql'
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=magna_test"
            echo "DB_USERNAME=magna"
            echo "DB_PASSWORD=secret"
          } >> "$GITHUB_ENV"

      # The panel renders its theme through @vite, so a request to any panel
      # page 500s without a built manifest. The suite covers those pages.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Code style (Pint)
        run: php vendor/bin/pint --test

      - name: Static analysis (PHPStan level 9)
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest)
        run: |
          set -o pipefail
          if ! php artisan test 2>&1 | tee test.log; then
            echo "::error::${{ matrix.db }} failures -- $(grep -aoE '(FAILED|⨯) [^│]{0,90}' test.log | tail -n 8 | tr '\n' ' ' | cut -c1-1200)"
            echo "::error::${{ matrix.db }} reason -- $(grep -aoE '(SQLSTATE\[[^]]+\][^|]{0,140}|Failed asserting[^|]{0,140}|Undefined [a-z ]+ "[^"]+")' test.log | sort -u | head -n 4 | tr '\n' ' ' | cut -c1-1200)"
            echo "::error::${{ matrix.db }} counts -- $(grep -aoE 'Tests:.*' test.log | tail -n 1 | cut -c1-160)"
            exit 1
          fi

  # The archive every site downloads, built the way release.yml builds it, so
  # the upgrade matrix below applies exactly what a customer would receive.
  build-archive:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifest's removed-classes diff reaches back to v1.2.0.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, gd, pdo_sqlite, sodium
          coverage: none

      - name: Create the environment file
        run: cp .env.example .env

      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --no-scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Build the archive (manifest + engine, self-verified)
        run: php bin/build-release.php

      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: downloads/magna-cms-v*.zip
          if-no-files-found: error
          retention-days: 3

  # The hop that shipped 1.4.3 to sites that could not receive it, proven on
  # every push: install a PREVIOUS release, let ITS updater apply the current
  # build, then assert under the new code that everything the release owns is
  # on disk, every config key resolves, and the site serves.
  upgrade-matrix:
    name: Upgrade from ${{ matrix.from }}
    runs-on: ubuntu-latest
    needs: build-archive
    strategy:
      fail-fast: false
      matrix:
        # the first release with the kernel (the hop that runs the engine
        # hand-off), the last legacy updater, previous minor, the floor the
        # private plugins target, and the last archive built
        # --classmap-authoritative.
        from: [v1.4.4, v1.4.3, v1.3.25, v1.3.16, v1.3.7]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, gd, pdo_sqlite, sodium
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: build

      - name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download "${{ matrix.from }}" --repo "${{ github.repository }}" --pattern 'magna-cms-v*.zip' --dir previous

      - name: Install the previous release
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q previous/magna-cms-v*.zip -d "$RUNNER_TEMP/site"
          php bin/ci/headless-install.php "$RUNNER_TEMP/site"

      - name: Update it with the current build, through its own updater
        run: php bin/ci/apply-headless.php "$RUNNER_TEMP/site" "$(ls build/magna-cms-v*.zip)"

      - name: Assert the site runs, and received, the current build
        run: |
          # An updater older than 1.4.4 records nothing about what it delivered;
          # the assertion then is that the site knows and says so.
          if php -r 'exit(version_compare("${{ matrix.from }}", "v1.4.4", "<") ? 0 : 1);'; then FLAG="--legacy-hop"; else FLAG=""; fi
          php bin/ci/assert-upgraded.php "$RUNNER_TEMP/site" --archive="$(ls build/magna-cms-v*.zip)" $FLAG

  # The same assertions against a fresh extract of the current build.
  fresh-install:
    name: Fresh install of the current build
    runs-on: ubuntu-latest
    needs: build-archive
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, gd, pdo_sqlite, sodium
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: build

      - name: Install and assert
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q build/magna-cms-v*.zip -d "$RUNNER_TEMP/site"
          php bin/ci/headless-install.php "$RUNNER_TEMP/site"
          php bin/ci/assert-upgraded.php "$RUNNER_TEMP/site" --archive="$(ls build/magna-cms-v*.zip)" --fresh

  # The oldest release with a one-click updater has no published archive, so
  # it is installed from its tag instead: composer install the way archives
  # of that era were built (classmap-authoritative, no PSR-4 fallback), which
  # is the harshest autoload situation an update can land on. Advisory until
  # it has proven stable: a resolution failure in a 2026-07 lock file is not a
  # regression in the updater.
  upgrade-from-checkout:
    name: Upgrade from ${{ matrix.from }} (checkout, advisory)
    runs-on: ubuntu-latest
    needs: build-archive
    continue-on-error: true
    strategy:
      matrix:
        from: [v1.2.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, pdo_sqlite, sodium
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: build

      - name: Check out and install the previous release
        run: |
          # That era's composer.json still wired the SDK as the path repository
          # ../magna-plugin-sdk, so the SDK has to sit beside the checkout.
          git clone --depth 1 https://github.com/Magna-CMS/Magna-Plugin-SDK.git "$RUNNER_TEMP/magna-plugin-sdk"
          git worktree add "$RUNNER_TEMP/site" "${{ matrix.from }}"
          cd "$RUNNER_TEMP/site"
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --classmap-authoritative --no-scripts
          cd -
          php bin/ci/headless-install.php "$RUNNER_TEMP/site"

      - name: Update it with the current build, through its own updater
        run: php bin/ci/apply-headless.php "$RUNNER_TEMP/site" "$(ls build/magna-cms-v*.zip)"

      - name: Assert the site runs, and received, the current build
        run: php bin/ci/assert-upgraded.php "$RUNNER_TEMP/site" --archive="$(ls build/magna-cms-v*.zip)" --legacy-hop

  octane-smoke:
    name: Octane / FrankenPHP smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: magna_test
          POSTGRES_USER: magna
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, pdo_pgsql, redis, pcntl
          coverage: none

      # composer's post-autoload-dump script boots Laravel to discover
      # packages, so the environment file has to exist before install runs.
      - name: Create the environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Install Octane
        run: composer require laravel/octane --no-interaction --no-progress

      - name: Prepare environment
        run: |
          php artisan key:generate
          php artisan package:discover --ansi
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=magna_test"
            echo "DB_USERNAME=magna"
            echo "DB_PASSWORD=secret"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "CACHE_STORE=redis"
            echo "MAGNA_INSTALLED=true"
          } >> .env
          php artisan migrate --force

      - name: Install FrankenPHP binary
        run: |
          curl -L https://github.com/dunglas/frankenphp/releases/latest/download/frankenphp-linux-x86_64 \
            -o /usr/local/bin/frankenphp && chmod +x /usr/local/bin/frankenphp

      - name: Boot under Octane and smoke-test
        run: |
          php artisan octane:frankenphp --port=8100 &
          OCTANE_PID=$!
          sleep 5

          # Smoke test: health endpoint must return 200
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8100/api/v1/health 2>/dev/null || echo "000")
          echo "Health check response: ${STATUS}"

          # Make 10 sequential requests to detect worker-mode leaks (shared state
          # that persists across requests causes diverging responses)
          for i in $(seq 1 10); do
            R=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8100/api/v1/health)
            [ "$R" = "200" ] || { echo "Request $i returned $R"; kill $OCTANE_PID; exit 1; }
          done

          kill $OCTANE_PID

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: cp .env.example .env
      # Not --strict: the exact pins and the SDK's packaged dist are deliberate.
      - run: composer validate --no-check-publish
      - run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - run: composer audit

  psalm:
    name: Psalm taint analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Run Psalm taint analysis on auth + delivery + management paths
        run: vendor/bin/psalm --taint-analysis --no-progress --output-format=github
