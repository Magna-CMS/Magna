name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write

jobs:
  # ── 1. Full test suite ────────────────────────────────────────────────────────
  test:
    name: Test suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.3", "8.4"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: magna_test
          POSTGRES_USER: magna
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, redis, gd, mbstring, openssl, fileinfo, bcmath, pcntl, sodium
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: magna_test
          DB_USERNAME: magna
          DB_PASSWORD: secret

      - name: Run test suite (Postgres)
        run: php artisan test --parallel
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: magna_test
          DB_USERNAME: magna
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run Pint (check only)
        run: php vendor/bin/pint --test

  # ── 2. Build the official archive and publish the release ─────────────────────
  # Build + publish are one job so the archive that bin/build-release.php produces
  # (and self-verifies) is exactly what gets attached to the GitHub release — no
  # artifact round-trip that could diverge. The archive MUST come from the builder
  # rather than a hand-rolled tar: only the builder injects the root forwarder the
  # documented "extract to the domain root" install flow relies on, runs
  # verify_release(), and emits the .sha256 the updater's checksum verification
  # (CoreUpdater) consumes as `zip_sha256`.
  build-and-release:
    name: Build archive and publish release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, gd, mbstring, openssl, fileinfo, bcmath, pcntl, sodium, zip
          coverage: none

      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build release archive (zip + SHA-256, self-verified)
        run: php bin/build-release.php "${GITHUB_REF_NAME}"

      - name: Extract changelog section for this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The changelog is maintained outside the public repository, so treat
          # it as optional and fall back to a generic note when it is absent.
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Magna CMS ${GITHUB_REF_NAME}. Download the archive below, extract it to your domain root, and open the site to run the installer." > release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Magna CMS ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            downloads/magna-cms-v*.zip
            downloads/magna-cms-v*.zip.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
