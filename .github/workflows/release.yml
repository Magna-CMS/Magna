name: Release

on:
  push:
    tags:
      # Stable tags, and pre-release tags such as v1.3.0-beta. A filter pattern
      # has to match the whole ref, so the suffix needs its own entry.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # ── 1. Full test suite ────────────────────────────────────────────────────────
  test:
    name: Test suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.3", "8.4"]

    # No service containers, and no database axis. This job used to run
    # Postgres and Redis beside a step called "Run test suite (Postgres)", and
    # the suite never touched either: tests/bootstrap.php sets
    # DB_CONNECTION=sqlite and DB_DATABASE=:memory: into putenv() plus $_ENV
    # plus $_SERVER before vendor/autoload.php is required, so no release has
    # ever run its suite against Postgres. The containers served one
    # `migrate:status` diagnostic that was terminated by `|| true` and could
    # not fail anything; what they produced instead was the single most
    # misleading line in the logs — `ERROR  Migration table not found.`
    # appears in passing runs, and a session spent an afternoon diagnosing a
    # failure by it.
    #
    # Earning the claim is its own task (a narrow escape hatch in
    # tests/bootstrap.php, then whatever a first real Postgres run surfaces).
    # Until then the gate says what it does.
    # tests/Unit/Release/TestDatabaseDriverTest.php holds both halves together.
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, pgsql, redis, gd, intl, zip, mbstring, openssl, fileinfo, bcmath, pcntl, sodium
          coverage: none

      # Cache Composer's download cache, never vendor/ itself: a restored
      # vendor/ from an older lock can carry packages this lock no longer has
      # (including path-repo symlinks to directories that do not exist in a
      # clone), and composer then trips over them before installing anything.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-cache-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-cache-${{ matrix.php }}-

      # Composer's post-autoload-dump script boots Laravel to discover
      # packages, so the environment file has to exist before install runs.
      - name: Create the environment file
        run: cp .env.example .env

      # --no-scripts: post-autoload-dump boots Laravel through
      # `artisan package:discover`, which needs an application key that only
      # exists after the next step. Discovery runs there instead.
      - name: Install dependencies
        run: |
          set -o pipefail
          if ! composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tee composer-install.log; then
            echo "::error::composer install failed -- $(grep -iE 'error|exception|fatal|failed|not satisfied|requires' composer-install.log | tail -n 8 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Prepare environment
        run: |
          set -o pipefail
          if ! php artisan key:generate 2>&1 | tee artisan.log; then
            echo "::error::key:generate failed -- $(tail -n 12 artisan.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          if ! php artisan package:discover --ansi 2>&1 | tee -a artisan.log; then
            echo "::error::package:discover failed -- $(tail -n 12 artisan.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
        env:
          APP_ENV: testing

      # The panel renders its theme through @vite; panel pages 500 without a
      # built manifest, and the suite requests them.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      # Serial, not --parallel: the backup and content-type suites share
      # filesystem and registry state, and parallel workers fail each other
      # non-deterministically. A release must not hinge on that coin flip.
      #
      # Scoped to Unit,Feature: phpunit.xml also declares the Plugins and
      # FirstPartyPlugins suites, whose directories live under plugins-dev/ —
      # gitignored, so never present in a CI checkout. A bare `php artisan
      # test` reads every declared suite and Pest aborts on the first missing
      # directory ("Test directory .../plugins-dev/magna/blog/tests not
      # found"), which is why every tag run from v1.3.20 to v1.4.8 failed
      # before executing a single test. The plugin suites are covered by the
      # local release gate (bin/support/release-gates.php runs
      # Unit,Feature,FirstPartyPlugins), where the plugin checkouts exist.
      #
      # Both annotations fall back to the tail of the log. The v1.4.9 tag run
      # failed with both of them empty: the suite had aborted on a missing
      # plugins-dev directory, which is neither a SQLSTATE nor a count, so the
      # one line that said what happened was the one line never captured.
      - name: Run test suite (SQLite)
        run: |
          set -o pipefail
          if ! php artisan test --testsuite=Unit,Feature 2>&1 | tee test.log; then
            REASON=$(grep -aoE 'SQLSTATE\[[^]]+\][^|]{0,220}' test.log | sort -u | head -n 4 | tr '\n' ' ' | cut -c1-1500)
            COUNTS=$(grep -aoE 'Tests: .*' test.log | tail -n 1 | cut -c1-200)
            TAIL=$(tail -n 15 test.log | tr '\n' ' ' | cut -c1-1500)
            echo "::error::suite failed -- ${REASON:-no SQLSTATE matched; log tail: $TAIL}"
            echo "::error::counts -- ${COUNTS:-none; the suite did not reach a summary -- log tail: $TAIL}"
            exit 1
          fi
        env:
          APP_ENV: testing

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run Pint (check only)
        run: php vendor/bin/pint --test

  # ── 2. Build the official archive and publish the release ─────────────────────
  # Build + publish are one job so the archive that bin/build-release.php produces
  # (and self-verifies) is exactly what gets attached to the GitHub release — no
  # artifact round-trip that could diverge. The archive MUST come from the builder
  # rather than a hand-rolled tar: only the builder injects the root forwarder the
  # documented "extract to the domain root" install flow relies on, runs
  # verify_release(), and emits the .sha256 the updater's checksum verification
  # (CoreUpdater) consumes as `zip_sha256`.
  build-and-release:
    name: Build archive and publish release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, pdo_pgsql, pgsql, redis, gd, intl, zip, mbstring, openssl, fileinfo, bcmath, pcntl, sodium
          coverage: none

      - name: Create the environment file
        run: cp .env.example .env

      # --no-scripts for the same reason as the test job: package discovery
      # needs a booted application, and the archive regenerates its own caches
      # on the target's first request anyway.
      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --no-scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # The builder reports what went wrong on stdout and exits non-zero. Without
      # this the job surfaced nothing but "Process completed with exit code 1",
      # so a release that failed here could not be diagnosed from the API at
      # all — same reason the test steps below already tee and echo.
      - name: Build release archive (zip + SHA-256, self-verified)
        run: |
          set -o pipefail
          if ! php bin/build-release.php "${GITHUB_REF_NAME}" 2>&1 | tee build.log; then
            echo "::error::release build failed -- $(grep -aiE 'error|fail|missing|could not|refus' build.log | tail -n 6 | tr '\n' ' ' | cut -c1-1200)"
            echo "::error::release build tail -- $(tail -n 12 build.log | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi

      # The changelog is maintained outside the public repository (CHANGELOG.md
      # is gitignored and never exists in a CI checkout), so the only per-release
      # text a tag push can carry is the tag's own annotation. An annotated tag
      # message becomes the release body; a lightweight or empty tag falls back
      # to the generic install note.
      - name: Write release notes from the tag annotation
        run: |
          # %(contents) of a signed tag carries the PGP block; strip it. A
          # lightweight tag yields nothing, so test for non-blank content
          # rather than mere file size.
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            cat > release_notes.md <<'NOTES'
          One-click, extract-and-run installer build. Install: upload and extract this ZIP to the root of your domain or subdomain, then open the site. The web installer runs automatically. No SSH, no Composer, and no document-root changes required. The archive bundles production dependencies (vendor/), compiled assets, and a root forwarder so it serves correctly straight from the extraction root.
          NOTES
          fi

      # Every release from v1.3.20 to v1.4.8 was published by hand with
      # `gh release create` while this workflow was red, so most tags already
      # have a release. Re-running one of those tags (or a backfilled tag)
      # must not clobber or duplicate the hand-published assets: publishing
      # here is only for a tag that has no release yet.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A release for ${GITHUB_REF_NAME} already exists; publishing is skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: "Magna CMS ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            downloads/magna-cms-v*.zip
            downloads/magna-cms-v*.zip.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
