name: Release

on:
  push:
    tags:
      # Stable tags, and pre-release tags such as v1.3.0-beta. A filter pattern
      # has to match the whole ref, so the suffix needs its own entry.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # ── 1. Full test suite ────────────────────────────────────────────────────────
  test:
    name: Test suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.3", "8.4"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: magna_test
          POSTGRES_USER: magna
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, redis, gd, intl, zip, mbstring, openssl, fileinfo, bcmath, pcntl, sodium
          coverage: none

      # Cache Composer's download cache, never vendor/ itself: a restored
      # vendor/ from an older lock can carry packages this lock no longer has
      # (including path-repo symlinks to directories that do not exist in a
      # clone), and composer then trips over them before installing anything.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-cache-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-cache-${{ matrix.php }}-

      # Composer's post-autoload-dump script boots Laravel to discover
      # packages, so the environment file has to exist before install runs.
      - name: Create the environment file
        run: cp .env.example .env

      # --no-scripts: post-autoload-dump boots Laravel through
      # `artisan package:discover`, which needs an application key that only
      # exists after the next step. Discovery runs there instead.
      - name: Install dependencies
        run: |
          set -o pipefail
          if ! composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tee composer-install.log; then
            echo "::error::composer install failed -- $(grep -iE 'error|exception|fatal|failed|not satisfied|requires' composer-install.log | tail -n 8 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Prepare environment
        run: |
          set -o pipefail
          if ! php artisan key:generate 2>&1 | tee artisan.log; then
            echo "::error::key:generate failed -- $(tail -n 12 artisan.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          if ! php artisan package:discover --ansi 2>&1 | tee -a artisan.log; then
            echo "::error::package:discover failed -- $(tail -n 12 artisan.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: magna_test
          DB_USERNAME: magna
          DB_PASSWORD: secret

      # The panel renders its theme through @vite; panel pages 500 without a
      # built manifest, and the suite requests them.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      # Serial, not --parallel: the backup and content-type suites share
      # filesystem and registry state, and parallel workers fail each other
      # non-deterministically. A release must not hinge on that coin flip.
      - name: Run test suite (Postgres)
        run: |
          set -o pipefail
          php artisan migrate:status 2>&1 | tail -n 5 || true
          if ! php artisan test 2>&1 | tee test.log; then
            echo "::error::suite failed -- $(grep -aoE 'SQLSTATE\[[^]]+\][^|]{0,220}' test.log | sort -u | head -n 4 | tr '\n' ' ' | cut -c1-1500)"
            echo "::error::counts -- $(grep -aoE 'Tests: .*' test.log | tail -n 1 | cut -c1-200)"
            exit 1
          fi
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: magna_test
          DB_USERNAME: magna
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run Pint (check only)
        run: php vendor/bin/pint --test

  # ── 2. Build the official archive and publish the release ─────────────────────
  # Build + publish are one job so the archive that bin/build-release.php produces
  # (and self-verifies) is exactly what gets attached to the GitHub release — no
  # artifact round-trip that could diverge. The archive MUST come from the builder
  # rather than a hand-rolled tar: only the builder injects the root forwarder the
  # documented "extract to the domain root" install flow relies on, runs
  # verify_release(), and emits the .sha256 the updater's checksum verification
  # (CoreUpdater) consumes as `zip_sha256`.
  build-and-release:
    name: Build archive and publish release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, gd, intl, zip, mbstring, openssl, fileinfo, bcmath, pcntl, sodium
          coverage: none

      - name: Create the environment file
        run: cp .env.example .env

      # --no-scripts for the same reason as the test job: package discovery
      # needs a booted application, and the archive regenerates its own caches
      # on the target's first request anyway.
      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --no-scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Build release archive (zip + SHA-256, self-verified)
        run: php bin/build-release.php "${GITHUB_REF_NAME}"

      - name: Extract changelog section for this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The changelog is maintained outside the public repository, so treat
          # it as optional and fall back to a generic note when it is absent.
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            cat > release_notes.md <<'NOTES'
          One-click, extract-and-run installer build. Install: upload and extract this ZIP to the root of your domain or subdomain, then open the site. The web installer runs automatically. No SSH, no Composer, and no document-root changes required. The archive bundles production dependencies (vendor/), compiled assets, and a root forwarder so it serves correctly straight from the extraction root.
          NOTES
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Magna CMS ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            downloads/magna-cms-v*.zip
            downloads/magna-cms-v*.zip.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
